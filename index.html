    <!-- Mobile responsiveness -->
    <style>
      @media (max-width: 768px) {
        /* Header */
        header { padding: 0 16px !important; }
        header nav a:not(:last-child) { display: none !important; }

        /* Main content */
        main { padding: 32px 16px !important; }

        /* Two-column table → single column */
        .dissg-two-col td { display: block !important; width: 100% !important; padding-right: 0 !important; }

        /* Tables scroll on mobile */
        table { overflow-x: auto; display: block; }

        /* Spec box */
        td[style*="background: #F4F4F4"] {
          margin-top: 24px;

      }
    </style>
